[package]
name = "sdlc"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"

[lib]
name = "sdlc"
path = "src/lib.rs"

[[bin]]
name = "sdlc"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
